# Run the EBO-SE bridge on an ARM Linux host.
#   1) populate ./vendor (see docs/SETUP.md)
#   2) copy .env.example to .env and fill in your credentials
#   3) docker compose up -d --build
services:
  ebo-bridge:
    build: .
    image: ebo-se-bridge:latest
    container_name: ebo-bridge
    restart: unless-stopped
    # host networking keeps RTSP/WebRTC/MQTT reachable on the LAN with no port juggling
    network_mode: host
    env_file: .env
